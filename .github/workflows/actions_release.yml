name: Release GitHub Actions

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release"
        required: true
      working_directory:
        description: "Comma-separated list of action directories"
        required: false
        default: "gh/setup-action, gh/.almost-original-build-push-action"
      script:
        description: "Build script to run"
        required: false
        default: "yarn build"
      node_version:
        description: "Node.js version"
        required: false
        default: "24"

permissions:
  contents: read

jobs:
  release:
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: step-security/reusable-workflows/.github/workflows/actions_release.yaml@v1
    with:
      tag: "${{ inputs.tag }}"
      working_directory: "${{ inputs.working_directory }}"
      script: "${{ inputs.script }}"
      node_version: "${{ inputs.node_version }}"
